<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Watercolor Gradients -->
    <linearGradient id="watercolor-wash-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="watercolor-wash-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Blur Filters for Watercolor Bleed -->
    <filter id="watercolor-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="glow" />
    </filter>

    <!-- Grid Pattern representing plotter coordinates -->
    <pattern id="plotter-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 12;
        animation: dash 25s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 6 10;
        animation: dash-rev 20s linear infinite;
      }
      .float-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      .pen-head {
        animation: penTravel 12s ease-in-out infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dash-rev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        50% { transform: scale(1.08) translate(15px, -10px); opacity: 0.95; }
        100% { transform: scale(0.96) translate(-10px, 15px); opacity: 0.7; }
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-30px, 20px); }
      }
      @keyframes penTravel {
        0% { transform: translate(0, 0); }
        25% { transform: translate(250px, 40px); }
        50% { transform: translate(500px, -20px); }
        75% { transform: translate(750px, 60px); }
        100% { transform: translate(0, 0); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Technical Plotter Coordinate Grid -->
  <rect width="1200" height="420" fill="url(#plotter-grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Algorithmic Watercolor Washes & Orbs -->
  <g class="glow-pulse" filter="url(#watercolor-blur)">
    <path d="M 150 120 Q 280 40 450 130 T 780 180 T 1050 100 Q 1150 220 980 320 T 600 350 T 220 300 Z" fill="url(#watercolor-wash-1)" />
  </g>

  <g class="float-orb" filter="url(#watercolor-blur)">
    <path d="M 850 80 Q 1050 120 1100 240 T 920 360 T 650 300 Q 720 150 850 80 Z" fill="url(#watercolor-wash-2)" />
    <circle cx="200" cy="260" r="140" fill="#06b6d4" opacity="0.18" />
  </g>

  <!-- DYNAMIC BACKGROUND ELEMENTS: Pen Plotter Vector Paths & G-Code Toolpaths -->
  <g opacity="0.35">
    <path class="dash-flow" d="M -50 340 C 200 260, 350 420, 600 320 S 950 200, 1250 280" fill="none" stroke="#ec4899" stroke-width="2" />
    <path class="dash-flow-rev" d="M -50 80 C 250 180, 500 40, 800 130 S 1050 60, 1250 110" fill="none" stroke="#38bdf8" stroke-width="1.75" />
    <path class="dash-flow" d="M 100 -20 C 300 220, 200 380, 500 390 S 900 360, 1150 440" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Animated Pen Plotter Crosshair Tracking Line -->
  <g class="pen-head" opacity="0.4" transform="translate(100, 280)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="0" r="2" fill="#f43f5e" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Title, Subtitle, and Feature Pills -->
  <!-- Top Category Pill / Meta Badge -->
  <g transform="translate(80, 55)">
    <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="145" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Generative Art &amp; Plotter Watercolor
  </text>

  <!-- Subtitle Line 1 -->
  <text x="80" y="195" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500">
    Algorithmic watercolor simulations, pen-plotter SVG engines &amp; creative coding
  </text>

  <!-- Subtitle Line 2 (Secondary details) -->
  <text x="80" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Powering AxiDraw, vpype, p5.js, Processing, vtracer &amp; frontier diffusion pipelines
  </text>

  <!-- Decorative Separator Rule -->
  <line x1="80" y1="265" x2="1120" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Interactive / Modern Feature Pills in Foreground -->
  <!-- Pill 1: Generative Watercolor -->
  <g transform="translate(80, 295)">
    <rect width="235" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="18" y="29" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">🎨 Watercolor &amp; Fluid</text>
    <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Pigment bleed &amp; wet-in-wet</text>
  </g>

  <!-- Pill 2: Pen Plotter Optimization -->
  <g transform="translate(330, 295)">
    <rect width="245" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="18" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">📐 Plotter &amp; G-Code</text>
    <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">vpype, AxiDraw, hatching</text>
  </g>

  <!-- Pill 3: Creative Coding Frameworks -->
  <g transform="translate(590, 295)">
    <rect width="250" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="18" y="29" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">💻 Creative Coding</text>
    <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">p5.js, Processing &amp; Nannou</text>
  </g>

  <!-- Pill 4: Vectorizer & Hatching -->
  <g transform="translate(855, 295)">
    <rect width="265" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
    <text x="18" y="29" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">⚡ Vectorizer Engines</text>
    <text x="18" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">vtracer, DrawingBotV3, TSP</text>
  </g>

  <!-- Bottom Coordinates Tag -->
  <text x="80" y="385" fill="#64748b" font-family="'SF Mono', Consolas, Monaco, monospace" font-size="11">
    G00 X0.00 Y0.00 | G01 Z-1.50 F1200 | AXIDRAW / VPYPE / VECTOR GENERATIVE TOOLSET
  </text>
</svg>
